<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <title>Razonamiento Matemático</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@400;600;700;800&family=Comfortaa:wght@600;700&family=Quicksand:wght@500;600;700&family=Oswald:wght@500;600&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-tema="oro">

  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
    <div class="brand" id="goHome">
      <span class="logo" id="logo">√</span>
      <div class="brand-texto">
        <strong>Razonamiento Matemático</strong>
        <small id="subtitulo">Inicio</small>
      </div>
    </div>
    <!-- Progreso de las 3 partes (anillos) -->
    <nav class="anillos" id="anillos" aria-label="Progreso por parte"></nav>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav id="menu"></nav>
      <button class="reset" id="resetBtn">↺ Reiniciar progreso</button>
    </aside>
    <div class="velo" id="velo"></div>
    <main id="app"></main>
  </div>

  <!-- El orden importa: utils y partes primero, luego los temas, al final app -->
  <script src="js/utils.js"></script>
  <script src="js/partes.js"></script>

  <!-- Parte 1 -->
  <script src="js/temas/tema1.js"></script>
  <script src="js/temas/tema2.js"></script>
  <script src="js/temas/tema3.js"></script>
  <script src="js/temas/tema4.js"></script>

  <!-- Parte 2 -->
  <script src="js/temas/tema5.js"></script>
  <script src="js/temas/tema6.js"></script>

  <!-- Parte 3 -->
  <script src="js/temas/tema7.js"></script>
  <script src="js/temas/tema8.js"></script>
  <script src="js/temas/tema9.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
